name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: coffeeshop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify runtime
        run: npm run check:runtime

      - name: Type and scenario checks
        run: npm run check

      - name: Security regression tests
        run: npm run test:security

      - name: Multi-instance database regressions
        run: npm run test:database
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/coffeeshop_test

      - name: Full dependency audit
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: i18n check
        run: npm run i18n:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
